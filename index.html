<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe6" />
    <meta name="description" content="Strength for the long run — heavy lifting, impact work, and the classes you love, balanced into one week." />

    <!-- PWA — iOS reads the apple-prefixed tags; Chromium the spec-aligned one.
         Ship both. Wolfram is built to be installed to the iPhone Home Screen:
         that's what earns persistent storage from WebKit. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wolfram" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts (Fraunces, DM Sans, DM Mono) are bundled: src/styles/fonts.css. -->

    <title>Wolfram — Strength for the Long Run</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
