    <!-- PWA — iOS reads the apple-prefixed tags; Chromium the spec-aligned one.
         Ship both. Wolfram is built to be installed to the iPhone Home Screen:
         that's what earns persistent storage from WebKit. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wolfram" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts: Fraunces (display), DM Sans (body), DM Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Wolfram — Strength for the Long Run</title>
  </head>
